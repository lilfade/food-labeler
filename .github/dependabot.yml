# Weekly pull requests for newer versions of the Python packages in the
# requirements files (lock files included) and of the GitHub Actions used by the
# workflows (pinned to commit SHAs with the version as a comment).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: Website

# Publishes site/ (the Food Labeler website) to GitHub Pages:
# https://lilfade.github.io/food-labeler/
# The pictures are copied from docs/ and assets/ at build time, so they are
# not kept twice in the repository. Pages must be turned on once in the
# repository settings: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/*.png"
      - "docs/samples/**"
      - "assets/**"
      - "food_labeler/assets/icon*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default; only the deploy job may publish (pages: write and the
# OIDC token GitHub Pages checks).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read          # configure-pages looks up the site's address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/* _site/
          mkdir -p _site/img
          cp docs/screenshot.png docs/screenshot-cottage.png \
             docs/screenshot-fancy-name.png docs/screenshot-picture-qr.png \
             _site/img/
          cp docs/samples/cottage_NE_large.png docs/samples/simple_small.png \
             docs/samples/simple_round.png docs/samples/simple_medium.png \
             _site/img/
          cp assets/round_seal.png _site/img/
          cp food_labeler/assets/icon-32.png food_labeler/assets/icon.png _site/img/
          ls -la _site _site/img

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

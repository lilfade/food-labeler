name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Belt and braces: the tests already set this, so no job can reach a printer.
      FOOD_LABELER_DRY_RUN: ${{ github.workspace }}/dry-run-jobs
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Exact versions, each file checked against its hash (see CONTRIBUTING.md).
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Pyflakes
        run: python -m pyflakes food_labeler tests tools food_labeler_main.py

      # Failing tests also show as annotations on the run, readable without signing in
      # (pytest-github-actions-annotate-failures, installed from the lock file).
      - name: Tests (headless; the opt-in UI tests stay skipped)
        run: python -m pytest -q -rs
